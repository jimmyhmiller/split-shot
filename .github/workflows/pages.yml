# Build the playground (the engine as wasm, then the Vite site) and publish it
# to GitHub Pages.
name: Playground

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "js-frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "playground/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/web/package-lock.json
      - name: Install
        working-directory: playground/web
        run: npm ci --ignore-scripts
      - name: Build the engine as wasm
        working-directory: playground/web
        run: npm run wasm
      - name: Build the site
        working-directory: playground/web
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
